name: UTUVOPanel
options:
  developmentLanguage: zh-Hant
  bundleIdPrefix: com.utuvo
  deploymentTarget: { iOS: "27.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "RPNT54P79S"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  UTUVOPanel:
    type: application
    platform: iOS
    sources:
      - path: UTUVOPanel
      - path: Shared
    dependencies:
      - target: PanelWidget
        embed: true
    entitlements:
      path: UTUVOPanel/UTUVOPanel.entitlements
      properties:
        com.apple.security.application-groups: [group.com.utuvo.panel]
        com.apple.developer.healthkit: true
    info:
      path: UTUVOPanel/Info.plist
      properties:
        CFBundleDisplayName: "UTUVO Panel"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        NSCalendarsFullAccessUsageDescription: "面板要顯示你接下來的行程。"
        NSLocationWhenInUseUsageDescription: "面板要顯示你所在地的天氣。"
        NSHealthShareUsageDescription: "面板要顯示今天的步數、距離、運動與站立。"
        NSHealthUpdateUsageDescription: "不會寫入任何健康資料。"
        CFBundleURLTypes:
          - CFBundleURLName: com.utuvo.panel
            CFBundleURLSchemes: [utuvopanel]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utuvo.panel
        PRODUCT_NAME: UTUVOPanel
        ASSETCATALOG_COMPILER_APPICON_NAME: UTUVOPanel
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "7"
  PanelWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PanelWidget
      - path: Shared
    # Stages a writable copy of the SDK WidgetKit framework with the preferredBackgroundStyle SPI
    # declarations appended (see tools/make-widgetkit-spi.sh). FRAMEWORK_SEARCH_PATHS below puts
    # that copy ahead of the system one so the swiftinterface parser sees the symbols.
    preBuildScripts:
      - name: WidgetKit SPI interface
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../tools/make-widgetkit-spi.sh" "$SDKROOT" "$PROJECT_TEMP_DIR/WidgetKitSPI/$PLATFORM_NAME"
    entitlements:
      path: PanelWidget/PanelWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.utuvo.panel]
        com.apple.developer.healthkit: true
    info:
      path: PanelWidget/Info.plist
      properties:
        CFBundleDisplayName: "UTUVO Panel"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSCalendarsFullAccessUsageDescription: "面板要顯示你接下來的行程。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utuvo.panel.widget
        PRODUCT_NAME: PanelWidget
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "7"
        SKIP_INSTALL: "YES"
        # The preBuildScript writes to PROJECT_TEMP_DIR, which the sandbox forbids without
        # this knob. Prefer the staging dir the script already creates.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_TEMP_DIR)/WidgetKitSPI/$(PLATFORM_NAME)"]
  UTUVOPanelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: UTUVOPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utuvo.panel.uitests
        TEST_TARGET_NAME: UTUVOPanel
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  UTUVOPanel:
    build:
      targets: { UTUVOPanel: all, PanelWidget: all, UTUVOPanelUITests: [test] }
    run: { config: Debug }
    test:
      config: Debug
      targets: [UTUVOPanelUITests]
