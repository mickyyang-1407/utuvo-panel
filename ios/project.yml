name: UTUVOPanel
options:
  bundleIdPrefix: com.utuvo
  deploymentTarget: { iOS: "27.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "RPNT54P79S"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  UTUVOPanel:
    type: application
    platform: iOS
    sources:
      - path: UTUVOPanel
      - path: Shared
    dependencies:
      - target: PanelWidget
        embed: true
    entitlements:
      path: UTUVOPanel/UTUVOPanel.entitlements
      properties:
        com.apple.security.application-groups: [group.com.utuvo.panel]
        com.apple.developer.healthkit: true
    info:
      path: UTUVOPanel/Info.plist
      properties:
        CFBundleDisplayName: "UTUVO Panel"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCalendarsFullAccessUsageDescription: "面板要顯示你接下來的行程。"
        NSLocationWhenInUseUsageDescription: "面板要顯示你所在地的天氣。"
        NSHealthShareUsageDescription: "面板要顯示今天的步數、運動與站立。"
        NSHealthUpdateUsageDescription: "不會寫入任何健康資料。"
        CFBundleURLTypes:
          - CFBundleURLName: com.utuvo.panel
            CFBundleURLSchemes: [glasspanel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utuvo.panel
        PRODUCT_NAME: UTUVOPanel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  PanelWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PanelWidget
      - path: Shared
    entitlements:
      path: PanelWidget/PanelWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.utuvo.panel]
    info:
      path: PanelWidget/Info.plist
      properties:
        CFBundleDisplayName: "UTUVO Panel"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSCalendarsFullAccessUsageDescription: "面板要顯示你接下來的行程。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utuvo.panel.widget
        PRODUCT_NAME: PanelWidget
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
  UTUVOPanelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: UTUVOPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utuvo.panel.uitests
        TEST_TARGET_NAME: UTUVOPanel
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  UTUVOPanel:
    build:
      targets: { UTUVOPanel: all, PanelWidget: all, UTUVOPanelUITests: [test] }
    run: { config: Debug }
    test:
      config: Debug
      targets: [UTUVOPanelUITests]
